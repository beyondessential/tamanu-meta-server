version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 14
    groups:
      actions-patches:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /private-web
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # TypeScript 7 is the native port, and its JS API no longer exposes
      # `ts.factory`, which openapi-typescript calls — so `npm run gen:api-types`
      # dies on import under TS 7. Hold at 5.x until openapi-typescript
      # supports it, then drop this.
      - dependency-name: typescript
        versions: [">=6"]
    groups:
      deps-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  # Two cargo projects: this workspace, and the published API client, which is not
  # a member of it (see release-plz.toml). A single entry would leave the crate
  # consumers actually depend on without updates.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      deps-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: cargo
    directory: /crates/canopy-api
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      deps-patches:
        patterns:
          - "*"
        update-types:
          - patch
          - minor
