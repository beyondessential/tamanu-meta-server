[workspace]
resolver = "3"
members = [
	"crates/commons-errors",
	"crates/commons-servers",
	"crates/commons-tests",
	"crates/commons-types",
	"crates/database",
	"crates/jobs",
	"crates/private-server",
	"crates/public-server",
]

[workspace.dependencies]
anyhow = "1"
aws-config = "1.8.18"
aws-sdk-cloudwatch = "1.116.0"
aws-sdk-s3 = "1.136.0"
aws-sdk-sts = "1.107.0"
aws-smithy-mocks = "0.2.6"
axum = "0.8.9"
axum-test = "20.0.0"
clap = "4.6.1"
diesel = "2.3.9"
diesel-async = "0.9.0"
futures = "0.3.32"
http = "1.4.0"
jiff = { version = "0.2.24", features = ["serde"] }
# k8s-openapi requires exactly one Kubernetes-version feature, and the version
# is pinned to 0.27 to match what kube 3.1 depends on (a mismatch causes a
# duplicate k8s-openapi with no version feature → build failure). `v1_32` is a
# conservative recent control-plane version — CONFIRM against the actual EKS
# control-plane version with ops before release (see spec open-question).
k8s-openapi = { version = "0.27.1", features = ["v1_32"] }
# Disable kube's default `ring` crypto backend and use `aws-lc-rs` instead, so
# we don't pull in a second rustls provider alongside the one the AWS SDK and
# the rest of the workspace already use.
kube = { version = "3.1.0", default-features = false, features = [
	"client",
	"config",
	"rustls-tls",
	"aws-lc-rs",
] }
lloggs = "1.4.0"
miette = "7.6.0"
mobc = "0.9.0"
node-semver = "2.2.0"
problem_details = "0.9.0"
pulldown-cmark = { version = "0.13.4", features = ["html"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "stream"] }
serde = "1.0.228"
tera = "1.20.1"
timesimp = "1.0.0"
tokio = "1.52.3"
tracing = "0.1.44"
utoipa = { version = "5", features = ["jiff_0_2", "uuid", "axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev.build-override]
opt-level = 0
codegen-units = 1024
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.release.build-override]
opt-level = 0
codegen-units = 1024
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
