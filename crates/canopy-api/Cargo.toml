[package]
# Published from this repository as the Rust client for canopy's public API.
# Publishing itself is card L3; until that lands the crate builds and tests here
# but is not pushed to the registry.
publish = false
name = "bes-canopy-api"
version = "0.1.0"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
description = "Rust client for the Canopy public API, generated from its OpenAPI document"
repository = "https://github.com/beyondessential/canopy"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
async-trait = "0.1.89"
bon = "3.9.3"
bytes = "1.12.1"
flate2 = "1.0.34"
http.workspace = true
jiff.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.19"
uuid = { version = "1.23.1", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.150"
tokio = { workspace = true, features = ["macros", "rt"] }
