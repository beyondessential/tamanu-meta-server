[package]
# Not published. `bes-internal` is not a configured registry, so cargo refuses to
# publish this crate, while release-plz still versions and tags it: it takes only
# `publish = false` or `[]` to mean a package is outside its scope entirely.
publish = ["bes-internal"]
name = "canopy-mcp"
version = "1.0.0"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
commons-types = { path = "../commons-types" }
database = { path = "../database" }
jiff = { version = "0.2.24", features = ["serde"] }
rmcp = { version = "2.2", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = "1.0.150"
tracing.workspace = true
