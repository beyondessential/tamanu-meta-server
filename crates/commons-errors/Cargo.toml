[package]
publish = false
name = "commons-errors"
version = "6.6.6"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
axum = { workspace = true, features = ["json", "macros"] }
diesel.workspace = true
# `pool` for `pooled_connection::PoolError`, which `AppError` wraps. Declared
# here rather than inherited from whichever other workspace member happens to
# turn it on, so this crate builds on its own.
diesel-async = { workspace = true, features = ["pool"] }
http.workspace = true
miette.workspace = true
mobc.workspace = true
node-semver.workspace = true
problem_details = { workspace = true, features = ["serde", "axum"] }
serde = { workspace = true, features = ["derive"] }
tera.workspace = true
thiserror = "2.0.18"
timesimp.workspace = true
utoipa.workspace = true
