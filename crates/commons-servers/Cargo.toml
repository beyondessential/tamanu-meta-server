[package]
publish = false
name = "commons-servers"
version = "6.6.6"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
age = { version = "0.12.1", default-features = false }
axum = { workspace = true, features = ["json", "macros"] }
axum-client-ip = { version = "1.3.1", features = ["forwarded-header"] }
axum-server-timing = "3.0.1"
chbs = "0.1.1"
commons-errors = { path = "../commons-errors" }
commons-types = { path = "../commons-types" }
database = { path = "../database" }
diesel = { workspace = true, features = [
	"ipnet-address",
	"serde_json",
	"uuid",
	"postgres_backend",
] }
diesel-async.workspace = true
http.workspace = true
jiff.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
node-semver.workspace = true
percent-encoding = "2.3.2"
rcgen = "0.14.8"
reqwest = { workspace = true, features = ["json"] }
rfc2047-decoder = "1.1.2"
ring = "0.17.14"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
time = "0.3.47"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7.0", features = [
	"compression-full",
	"decompression-full",
	"fs",
	"trace",
] }
tracing.workspace = true
x509-parser = "0.18.1"
