[package]
publish = false
name = "commons-types"
description = "Serialisable types shared across the canopy crates."
version = "6.6.6"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
base64 = "0.23.0"
commons-errors = { path = "../commons-errors" }
# `postgres` for the `ToSql`/`FromSql` impls these types carry against
# `diesel::pg::Pg`. Declared here rather than inherited from whichever other
# workspace member happens to turn it on, so this crate builds on its own.
diesel = { workspace = true, features = ["postgres"] }
jiff.workspace = true
node-semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
utoipa.workspace = true
uuid = { version = "1.23.1", features = ["serde"] }
