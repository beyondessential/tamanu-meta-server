[package]
publish = false
name = "jobs"
version = "6.6.6"
edition = "2024"
resolver = "3"
license = "GPL-3.0-or-later"
authors = [
	"Félix Saparelli <felix@passcod.name>",
	"BES Developers <contact@bes.au>",
]

[dependencies]
anyhow.workspace = true
aws-config.workspace = true
aws-sdk-cloudwatch.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-sts.workspace = true
axum.workspace = true
bestool-kopia.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
commons-errors = { path = "../commons-errors" }
commons-servers = { path = "../commons-servers" }
commons-types = { path = "../commons-types" }
database = { path = "../database" }
diesel-async = { workspace = true, features = ["mobc", "postgres"] }
futures = { workspace = true }
hostname = "0.4.2"
jiff = { workspace = true }
k8s-openapi.workspace = true
kube.workspace = true
lloggs = { workspace = true, features = ["miette-7"] }
miette = { workspace = true, features = ["fancy"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "sync"] }
tracing.workspace = true
uuid = { version = "1.23.1", features = ["v4"] }

[dev-dependencies]
aws-sdk-s3 = { workspace = true, features = ["test-util"] }
aws-smithy-mocks.workspace = true
commons-tests = { path = "../commons-tests" }
diesel = { workspace = true }
uuid = { version = "1.23.1", features = ["v4"] }
